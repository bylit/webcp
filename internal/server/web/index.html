<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f6">
  <title>webcp</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="webcp home">
        <span class="brand-art">
          <img class="brand-logo" src="/webcp.png" alt="webcp">
          <img class="brand-logo brand-logo-contrast" src="/webcp.png" alt="" aria-hidden="true">
        </span>
      </a>
      <div class="topbar-status">
        <span><i class="status-dot"></i><strong id="active-stat">0</strong> active</span>
        <span><svg viewBox="0 0 24 24"><path d="M4 18V9m5 9V5m6 13v-7m5 7V3"/></svg><strong id="speed-stat">0 B/s</strong></span>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle dark mode" title="Appearance">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <button id="open-add-dialog" class="toolbar-button primary" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg>
          Add
        </button>
        <div id="filters" class="filters" aria-label="Filter downloads">
          <button class="active" data-filter="all">All</button>
          <button data-filter="active">Active</button>
          <button data-filter="completed">Completed</button>
          <button data-filter="paused">Paused</button>
          <button data-filter="error">Failed</button>
        </div>
        <span id="result-count" class="result-count">0 files</span>
      </div>

      <div id="download-list" class="download-list" aria-live="polite"></div>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <dialog id="add-dialog" class="add-dialog">
    <form id="download-form">
      <div class="dialog-heading">
        <div><h2>Add download</h2><p>Enter a direct HTTP or HTTPS link.</p></div>
        <button id="add-close" class="icon-button" type="button" aria-label="Close">×</button>
      </div>
      <label class="field">
        <span>File URL</span>
        <div class="input-shell"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg><input id="url-input" type="url" required autocomplete="off" placeholder="https://example.com/file.zip"></div>
      </label>
      <div class="field">
        <span>Save to</span>
        <button id="folder-button" class="folder-button" type="button"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg><span id="folder-path">Loading…</span><svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="add-cancel" class="secondary-button" type="button">Cancel</button><button id="submit-button" class="primary-button" type="submit">Add download</button></div>
    </form>
  </dialog>

  <dialog id="folder-dialog" class="folder-dialog">
    <div class="dialog-heading">
      <div><h2>Choose a folder</h2><p>Container filesystem</p></div>
      <button id="folder-close" class="icon-button" type="button" aria-label="Close folder picker">×</button>
    </div>
    <div class="path-entry"><input id="folder-path-input" aria-label="Container path" autocomplete="off" spellcheck="false"><button id="folder-go" class="secondary-button" type="button">Go</button></div>
    <div class="folder-toolbar"><button id="folder-up" class="secondary-button" type="button">← Up</button><button id="folder-default" class="secondary-button" type="button">Default</button><button id="folder-new" class="secondary-button" type="button">＋ New folder</button></div>
    <div id="new-folder-row" class="new-folder-row hidden"><input id="new-folder-name" maxlength="255" autocomplete="off" placeholder="Folder name"><button id="new-folder-create" class="primary-button" type="button">Create &amp; select</button><button id="new-folder-cancel" class="icon-button" type="button" aria-label="Cancel new folder">×</button></div>
    <div id="folder-browser" class="folder-browser"></div>
    <p id="folder-error" class="form-error" role="alert"></p>
    <div class="folder-dialog-footer"><div><span>Selected</span><strong id="folder-selection"></strong></div><button id="folder-choose" class="primary-button" type="button">Choose folder</button></div>
  </dialog>

  <dialog id="delete-dialog" class="delete-dialog">
    <form method="dialog">
      <div class="danger-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16m-10 4v6m4-6v6M9 7l1-3h4l1 3m3 0-1 14H7L6 7"/></svg></div>
      <h2>Delete this download?</h2>
      <p>This removes the job and its downloaded file. This cannot be undone.</p>
      <div class="dialog-actions"><button value="cancel" class="secondary-button">Cancel</button><button id="confirm-delete" value="default" class="danger-button">Delete file</button></div>
    </form>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
